[package]
name = "factorio-dat-settings"
version = "1.0.0"
edition = "2024"
authors = ["Kraid | Tathagata S. under Kivx.in"]
description = "CLI for parsing and compiling Factorio mod-settings.dat files."
license = "MIT"
readme = "README.md"
repository = "https://github.com/MasterKraid/Factorio-DAT-encoder-decoder-Rust---Bun-Implementation"
keywords = ["factorio", "modding", "dat", "parser", "ffi"]

[lib]
name = "factorio_settings" 
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "factorio_settings_cli" 
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "1.0"
